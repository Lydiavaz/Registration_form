<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
  </head>
  <body>
    <h1>Course Registration Form</h1>
    <form action="">
      <fieldset>

      <legend>Personal Details</legend>
      <table>
        
        <tr>
          <td><label for="fname">First Name</label></td>
          <td>
            <input type="text" id="fname" required placeholder="Ex: Lydia" />
          </td>
        </tr>

        <tr>
          <td><label for="sname">Surname</label></td>
          <td>
            <input type="text" id="sname" required placeholder="Ex: Vaz" />
          </td>
        </tr>

        <tr>
          <td><label for="mobile">Mobile Number</label></td>
          <td>
            <input type="tel" id="mobile" required placeholder="9876543210" />
          </td>
        </tr>

        <tr>
          <td><label for="email">Email</label></td>
          <td>
            <input
              type="email"
              id="email"
              required
              placeholder="example@gmail.com"
            />
          </td>
        </tr>

        <tr>
          <td><label for="password">Password</label></td>
          <td><input type="password" id="password" required /></td>
        </tr>

        <tr>
          <td><label for="confirm">Confirm Password</label></td>
          <td><input type="password" id="confirm" required /></td>
        </tr>

        <tr>
          <td><label for="dob">Date of Birth</label></td>
          <td><input type="date" id="dob" required /></td>
        </tr>

        <tr>
          <td><label for="age">Age</label></td>
          <td><input type="number" id="age" required /></td>
        </tr>

        <tr>
          <td><label>Gender</label></td>
          <td>
            <input type="radio" name="gender" value="male" />
            <label for="male">Male</label>

            <input type="radio" name="gender" value="female" />
            <label for="female">Female</label>

            <input type="radio" name="gender" value="other" />
            <label for="other">Other</label>
          </td>
        </tr>

        <tr>
          <td><label for="country">Select Country</label></td>
          <td>
            <select name="country" id="country">
              <option value="">INDIA</option>
              <option value="USA">USA</option>
              <option value="CHINA">CHINA</option>
              <option value="JAPAN">JAPAN</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><label for="photo">Upload Picture</label></td>
          <td><input type="file" required /></td>
        </tr>
      </table>
      
      
      </fieldset>
      
        <fieldset>
      <legend>Course Details</legend>
      <table>
        <tr>
          <td><label for="course">Select Course</label></td>
          <td>
            <select id="course" required>
              <option value="">-- Select --</option>
              <option value="web">Web Development</option>
              <option value="java">Java Programming</option>
              <option value="python">Python Programming</option>
              <option value="uiux">UI/UX Design</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><label>Delivery Mode</label></td>
          <td>
            <input type="radio" id="online" name="mode" value="online" />
            <label for="online">Online</label>

            <input type="radio" id="offline" name="mode" value="offline" />
            <label for="offline">Offline</label>
          </td>
        </tr>

        <tr>
          <td><label for="institute">Institute Name</label></td>
          <td>
            <input
              type="text"
              id="institute"
              required
              placeholder="TAP ACADEMY"
            />
          </td>
        </tr>

        <tr>
          <td><label for="comments">Comments</label></td>
          <td>
            <textarea
              id="commnents"
              placeholder="Any additional comments or questions..."
            ></textarea>
          </td>
        </tr>

        <tr>
          <td>
            <button type="submit">Submit</button>
          </td>
        </tr>
      
      </fieldset>
      </table>
      
    </form>
  </body>
</html>
